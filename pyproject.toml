[tool.poetry]
name = "sentinel"
version = "0.1.0"
description = "Agentic fraud detection framework for real-time transaction security"
authors = ["Sentinel Team"]
readme = "README.md"
packages = [
  { include = "agents" },
  { include = "data" },
  { include = "graph" },
  { include = "ml" },
  { include = "orchestrator" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
aiokafka = "0.10.0"
fastapi = "0.111.0"
kafka-python = "2.0.2"
mlflow = "2.13.0"
neo4j = "5.20.0"
numpy = "1.26.4"
pandas = "2.2.2"
psycopg = { version = "3.1.19", extras = ["binary"] }
pyarrow = "15.0.2"
setuptools = "70.0.0"
pydantic = "2.7.4"
python-dotenv = "1.0.1"
geopy = "2.4.1"
redis = "5.0.4"
scikit-learn = "1.5.0"
structlog = "24.2.0"
torch = "2.3.1"
uvicorn = { version = "0.30.1", extras = ["standard"] }

[tool.poetry.group.dev.dependencies]
black = "24.4.2"
httpx = "0.27.0"
locust = "2.28.0"
pre-commit = "3.7.1"
pytest = "8.2.2"
pytest-asyncio = "0.23.7"
ruff = "0.4.8"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "sita.py", "sim_swap.py", "cold_start.py", "mule_ring.py"]
